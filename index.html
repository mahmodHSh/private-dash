<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>متابعة مِسْبَحَتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #07211f;
        --bg-mid: #0f3a3a;
        --bg-warm: #0a2e33;
        --gold: #d4af37;
        --gold-light: #f2d78c;
        --gold-dim: #8a7132;
        --ivory: #f4ecda;
        --ivory-dim: rgba(244, 236, 218, 0.62);
        --glass: rgba(255, 255, 255, 0.06);
        --glass-strong: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(244, 236, 218, 0.16);
        --ok: #4caf82;
        --warn: #c1554a;
        --warn-dim: rgba(193, 85, 74, 0.16);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
        background:
          radial-gradient(1100px 700px at 18% -10%, rgba(212, 175, 55, 0.1), transparent 60%),
          radial-gradient(900px 900px at 100% 110%, rgba(20, 90, 90, 0.35), transparent 60%),
          linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-warm) 100%);
        color: var(--ivory);
        font-family: "Tajawal", sans-serif;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }

      /* ---- beads divider — small nod to the app's own motif ---- */
      .beads {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin: 18px 0 22px;
        opacity: 0.55;
      }
      .beads span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--gold);
      }

      h1 {
        font-family: "Amiri", serif;
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--gold-light);
        text-align: center;
      }
      .sub {
        text-align: center;
        color: var(--ivory-dim);
        font-size: 0.85rem;
        margin-top: 6px;
      }

      /* ---- login ---- */
      #loginScreen {
        max-width: 340px;
        margin: 14vh auto 0;
        padding: 26px 22px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        text-align: center;
      }
      #loginScreen input {
        width: 100%;
        font-family: "Tajawal", sans-serif;
        font-size: 0.92rem;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--glass-border);
        background: rgba(0, 0, 0, 0.18);
        color: var(--ivory);
        outline: none;
        margin-top: 12px;
      }
      #loginScreen input::placeholder {
        color: var(--ivory-dim);
      }
      #loginBtn {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        color: #1a1408;
        font-family: "Tajawal", sans-serif;
        font-weight: 700;
        font-size: 0.94rem;
        cursor: pointer;
      }
      #loginBtn:active {
        transform: scale(0.98);
      }
      #loginError {
        margin-top: 12px;
        color: var(--warn);
        font-size: 0.82rem;
        min-height: 1em;
      }

      /* ---- dashboard ---- */
      #dashScreen.hidden,
      #loginScreen.hidden {
        display: none;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }
      .logoutBtn {
        background: none;
        border: 1px solid var(--glass-border);
        color: var(--ivory-dim);
        font-family: "Tajawal", sans-serif;
        font-size: 0.78rem;
        padding: 7px 12px;
        border-radius: 10px;
        cursor: pointer;
      }

      .summary {
        display: flex;
        gap: 10px;
        margin: 18px 0 8px;
      }
      .summary-card {
        flex: 1;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 14px 10px;
        text-align: center;
      }
      .summary-card b {
        display: block;
        font-size: 1.5rem;
        color: var(--gold-light);
        font-family: "Amiri", serif;
      }
      .summary-card span {
        font-size: 0.74rem;
        color: var(--ivory-dim);
      }

      .empty {
        text-align: center;
        color: var(--ivory-dim);
        font-size: 0.9rem;
        margin-top: 40px;
        line-height: 1.9;
      }

      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 16px;
      }

      .card {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 16px;
      }
      .card.inactive {
        background: var(--warn-dim);
        border: 1px dashed rgba(193, 85, 74, 0.5);
      }

      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .card-name {
        font-family: "Amiri", serif;
        font-weight: 700;
        font-size: 1.08rem;
        color: var(--ivory);
      }
      .card-tag {
        font-size: 0.68rem;
        color: var(--ivory-dim);
        margin-inline-start: 6px;
        opacity: 0.7;
      }
      .card-last {
        font-size: 0.74rem;
        color: var(--ivory-dim);
        white-space: nowrap;
      }
      .card.inactive .card-last {
        color: var(--warn);
        font-weight: 500;
      }

      .adhkar-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .adhkar-pill {
        flex: 1;
        text-align: center;
        font-size: 0.76rem;
        padding: 6px 4px;
        border-radius: 9px;
        border: 1px solid var(--glass-border);
        color: var(--ivory-dim);
      }
      .adhkar-pill.done {
        color: var(--ok);
        border-color: rgba(76, 175, 130, 0.4);
        background: rgba(76, 175, 130, 0.08);
      }

      .phrase-list {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .phrase-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.85rem;
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.14);
      }
      .phrase-row .label {
        color: var(--ivory-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .phrase-row .count {
        font-family: "Amiri", serif;
        font-weight: 700;
        color: var(--gold-light);
        flex-shrink: 0;
      }
      .phrase-row.zero .count {
        color: var(--ivory-dim);
        font-weight: 400;
      }
      .no-phrases {
        font-size: 0.8rem;
        color: var(--ivory-dim);
        margin-top: 10px;
      }

      /* ---- remove user ---- */
      .card-side {
        display: flex;
        align-items: center;
        align-self: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .delBtn {
        background: none;
        border: 1px solid rgba(193, 85, 74, 0.45);
        color: var(--warn);
        font-family: "Tajawal", sans-serif;
        font-size: 0.72rem;
        line-height: 1;
        padding: 6px 9px;
        border-radius: 9px;
        cursor: pointer;
        opacity: 0.75;
      }
      .delBtn:hover {
        opacity: 1;
        background: rgba(193, 85, 74, 0.14);
      }
      .delBtn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(3, 16, 15, 0.72);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
      }
      .modal.hidden {
        display: none;
      }
      .modal-box {
        width: 100%;
        max-width: 330px;
        background: linear-gradient(160deg, #0e3230, #0a2a2d);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        padding: 22px 20px 18px;
        text-align: center;
      }
      .modal-title {
        font-family: "Amiri", serif;
        font-weight: 700;
        font-size: 1.12rem;
        color: var(--gold-light);
      }
      .modal-text {
        margin-top: 10px;
        font-size: 0.85rem;
        line-height: 1.85;
        color: var(--ivory-dim);
      }
      .modal-text b {
        color: var(--ivory);
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .modal-actions button {
        flex: 1;
        padding: 11px;
        border-radius: 11px;
        font-family: "Tajawal", sans-serif;
        font-size: 0.86rem;
        font-weight: 700;
        cursor: pointer;
        border: 1px solid var(--glass-border);
      }
      .btn-ghost {
        background: none;
        color: var(--ivory-dim);
      }
      .btn-danger {
        background: var(--warn);
        border-color: var(--warn);
        color: #fff;
      }
      .btn-danger:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>متابعة مِسْبَحَتي</h1>
      <div class="sub">نظرة سريعة على تسبيحات وأذكار الجميع اليوم</div>
      <div class="beads"><span></span><span></span><span></span><span></span><span></span></div>

      <div id="loginScreen">
        <input type="email" id="emailInput" placeholder="الإيميل" autocomplete="username" />
        <input type="password" id="passInput" placeholder="كلمة المرور" autocomplete="current-password" />
        <button id="loginBtn">تسجيل الدخول</button>
        <div id="loginError"></div>
      </div>

      <div id="dashScreen" class="hidden">
        <div class="topbar">
          <button class="logoutBtn" id="logoutBtn">تسجيل الخروج</button>
        </div>
        <div class="summary">
          <div class="summary-card"><b id="activeCount">0</b><span>فعّلوا النهاردة</span></div>
          <div class="summary-card"><b id="totalCount">0</b><span>إجمالي المسجّلين</span></div>
        </div>
        <div id="empty" class="empty hidden">لسه محدش اتسجل في التطبيق.</div>
        <div id="cards" class="cards"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-title">إزالة المستخدم</div>
        <div class="modal-text" id="modalText"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="modalCancel">إلغاء</button>
          <button class="btn-danger" id="modalConfirm">إزالة</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getFirestore,
        collection,
        doc,
        onSnapshot,
        getDocs,
        deleteDoc,
        writeBatch,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyB9wgsMJAkt5A5kAHQZ_cFGX_PPEXuj5so",
        authDomain: "misbaha-dashboard.firebaseapp.com",
        projectId: "misbaha-dashboard",
        storageBucket: "misbaha-dashboard.firebasestorage.app",
        messagingSenderId: "733639745522",
        appId: "1:733639745522:web:774e401f732882d787956b",
        measurementId: "G-RX0G0C6KS1",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const loginScreen = document.getElementById("loginScreen");
      const dashScreen = document.getElementById("dashScreen");
      const emailInput = document.getElementById("emailInput");
      const passInput = document.getElementById("passInput");
      const loginBtn = document.getElementById("loginBtn");
      const loginError = document.getElementById("loginError");
      const logoutBtn = document.getElementById("logoutBtn");
      const cardsEl = document.getElementById("cards");
      const emptyEl = document.getElementById("empty");
      const activeCountEl = document.getElementById("activeCount");
      const totalCountEl = document.getElementById("totalCount");
      const modal = document.getElementById("modal");
      const modalText = document.getElementById("modalText");
      const modalCancel = document.getElementById("modalCancel");
      const modalConfirm = document.getElementById("modalConfirm");

      function todayStr() {
        const d = new Date();
        return (
          d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")
        );
      }

      function loginErrorMessage(code) {
        if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
          return "الإيميل أو كلمة المرور غير صحيحة";
        }
        if (code === "auth/invalid-email") return "صيغة الإيميل غير صحيحة";
        if (code === "auth/too-many-requests") return "محاولات كتير، حاول تاني بعد شوية";
        return "حصلت مشكلة في تسجيل الدخول";
      }

      loginBtn.addEventListener("click", async () => {
        loginError.textContent = "";
        const email = emailInput.value.trim();
        const pass = passInput.value;
        if (!email || !pass) {
          loginError.textContent = "اكتب الإيميل وكلمة المرور";
          return;
        }
        loginBtn.disabled = true;
        loginBtn.textContent = "جاري الدخول…";
        try {
          await signInWithEmailAndPassword(auth, email, pass);
        } catch (e) {
          loginError.textContent = loginErrorMessage(e.code);
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "تسجيل الدخول";
        }
      });
      passInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") loginBtn.click();
      });

      logoutBtn.addEventListener("click", () => signOut(auth));

      // ---- live data layer ----
      const userDocs = new Map(); // uid -> { name, phrases }
      const dailyDocs = new Map(); // uid -> { counts, morningDone, eveningDone, lastActive }
      const dailyUnsubs = new Map(); // uid -> unsubscribe fn
      let usersUnsub = null;
      let watchedDate = todayStr();

      function relativeTime(ts) {
        if (!ts) return "لسه محدش تفاعل";
        const then = ts.toDate ? ts.toDate() : new Date(ts);
        const diffMin = Math.round((Date.now() - then.getTime()) / 60000);
        if (diffMin < 1) return "الآن";
        if (diffMin < 60) return "منذ " + diffMin + " د";
        const diffH = Math.round(diffMin / 60);
        if (diffH < 24) return "منذ " + diffH + " س";
        const diffD = Math.round(diffH / 24);
        return "منذ " + diffD + " يوم";
      }

      function watchDaily(uid) {
        if (dailyUnsubs.has(uid)) return;
        const dref = doc(db, "users", uid, "daily", watchedDate);
        const unsub = onSnapshot(dref, (snap) => {
          dailyDocs.set(uid, snap.exists() ? snap.data() : null);
          render();
        });
        dailyUnsubs.set(uid, unsub);
      }

      function unwatchDaily(uid) {
        const unsub = dailyUnsubs.get(uid);
        if (unsub) unsub();
        dailyUnsubs.delete(uid);
        dailyDocs.delete(uid);
      }

      function startUsersListener() {
        usersUnsub = onSnapshot(collection(db, "users"), (snap) => {
          const seen = new Set();
          snap.forEach((d) => {
            seen.add(d.id);
            userDocs.set(d.id, d.data());
            watchDaily(d.id);
          });
          // clean up users that no longer exist
          for (const uid of Array.from(userDocs.keys())) {
            if (!seen.has(uid)) {
              userDocs.delete(uid);
              unwatchDaily(uid);
            }
          }
          render();
        });
      }

      function stopAllListeners() {
        if (usersUnsub) usersUnsub();
        usersUnsub = null;
        for (const uid of Array.from(dailyUnsubs.keys())) unwatchDaily(uid);
        userDocs.clear();
      }

      // If the page stays open across midnight, re-point every daily listener
      // at the new date instead of silently freezing on yesterday's document.
      setInterval(() => {
        const nowDate = todayStr();
        if (nowDate !== watchedDate) {
          watchedDate = nowDate;
          for (const uid of Array.from(dailyUnsubs.keys())) unwatchDaily(uid);
          for (const uid of userDocs.keys()) watchDaily(uid);
        }
      }, 60000);

      // ---- removing a user ----
      const removing = new Set(); // uids currently being deleted
      let pendingUid = null;

      function askRemove(uid, name) {
        pendingUid = uid;
        modalText.innerHTML = "";
        const line1 = document.createElement("div");
        line1.innerHTML = "هتشيل <b></b> من الداشبورد نهائيًا.";
        line1.querySelector("b").textContent = name;
        const line2 = document.createElement("div");
        line2.textContent = "هيتسجّل خروجه من التطبيق، ولو حب يرجع لازم يكتب اسمه من جديد ويبدأ من الصفر.";
        modalText.appendChild(line1);
        modalText.appendChild(line2);
        modal.classList.remove("hidden");
      }

      function closeModal() {
        pendingUid = null;
        modal.classList.add("hidden");
        modalConfirm.disabled = false;
        modalConfirm.textContent = "إزالة";
      }

      modalCancel.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal && !modalConfirm.disabled) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.classList.contains("hidden") && !modalConfirm.disabled) closeModal();
      });

      modalConfirm.addEventListener("click", async () => {
        const uid = pendingUid;
        if (!uid) return;
        modalConfirm.disabled = true;
        modalConfirm.textContent = "جاري الإزالة…";
        removing.add(uid);
        render();
        try {
          await removeUser(uid);
          closeModal();
        } catch (e) {
          console.error(e);
          modalConfirm.disabled = false;
          modalConfirm.textContent = "إزالة";
          modalText.textContent = "مقدرتش أشيله — جرّب تاني، وتأكد إن صلاحيات الحذف مفعّلة في قواعد Firestore.";
        } finally {
          removing.delete(uid);
          render();
        }
      });

      async function removeUser(uid) {
        // 1) امسح كل أيام المستخدم (الـ subcollection) على دفعات
        const dailySnap = await getDocs(collection(db, "users", uid, "daily"));
        const docsList = dailySnap.docs;
        for (let i = 0; i < docsList.length; i += 400) {
          const batch = writeBatch(db);
          docsList.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
          await batch.commit();
        }
        // 2) امسح مستند المستخدم نفسه في الآخر — ده الإشارة اللي بيتخرّج بيها من التطبيق
        await deleteDoc(doc(db, "users", uid));
        // 3) نظّف المتابعة المحلية فورًا من غير ما نستنى الـ listener
        userDocs.delete(uid);
        unwatchDaily(uid);
      }

      function render() {
        const uids = Array.from(userDocs.keys());
        totalCountEl.textContent = uids.length;

        if (uids.length === 0) {
          emptyEl.classList.remove("hidden");
          cardsEl.innerHTML = "";
          activeCountEl.textContent = "0";
          return;
        }
        emptyEl.classList.add("hidden");

        const rows = uids.map((uid) => {
          const user = userDocs.get(uid) || {};
          const daily = dailyDocs.get(uid);
          const isActive = !!(daily && daily.lastActive);
          return { uid, user, daily, isActive };
        });

        activeCountEl.textContent = rows.filter((r) => r.isActive).length;

        // inactive-today people surface first — they're the ones worth a nudge
        rows.sort((a, b) => {
          if (a.isActive !== b.isActive) return a.isActive ? 1 : -1;
          const at = a.daily && a.daily.lastActive ? a.daily.lastActive.toMillis() : 0;
          const bt = b.daily && b.daily.lastActive ? b.daily.lastActive.toMillis() : 0;
          return bt - at;
        });

        cardsEl.innerHTML = "";
        rows.forEach(({ uid, user, daily, isActive }) => {
          const card = document.createElement("div");
          card.className = "card" + (isActive ? "" : " inactive");

          const head = document.createElement("div");
          head.className = "card-head";
          const name = document.createElement("div");
          name.className = "card-name";
          name.textContent = user.name || "مستخدم بدون اسم";
          const tag = document.createElement("span");
          tag.className = "card-tag";
          tag.textContent = "#" + uid.slice(-4);
          name.appendChild(tag);
          const last = document.createElement("div");
          last.className = "card-last";
          last.textContent = isActive ? relativeTime(daily.lastActive) : "محدش نشط النهاردة";

          const side = document.createElement("div");
          side.className = "card-side";
          const del = document.createElement("button");
          del.className = "delBtn";
          del.type = "button";
          del.title = "إزالة المستخدم";
          const busy = removing.has(uid);
          del.disabled = busy;
          del.textContent = busy ? "…" : "إزالة";
          del.addEventListener("click", () => askRemove(uid, user.name || " بدون اسم"));
          side.appendChild(last);
          side.appendChild(del);

          head.appendChild(name);
          head.appendChild(side);
          card.appendChild(head);

          const adhkarRow = document.createElement("div");
          adhkarRow.className = "adhkar-row";
          const morning = document.createElement("div");
          morning.className = "adhkar-pill" + (daily && daily.morningDone ? " done" : "");
          morning.textContent = (daily && daily.morningDone ? "✓ " : "") + "أذكار الصباح";
          const evening = document.createElement("div");
          evening.className = "adhkar-pill" + (daily && daily.eveningDone ? " done" : "");
          evening.textContent = (daily && daily.eveningDone ? "✓ " : "") + "أذكار المساء";
          adhkarRow.appendChild(morning);
          adhkarRow.appendChild(evening);
          card.appendChild(adhkarRow);

          const phrases = Array.isArray(user.phrases) ? user.phrases : [];
          if (phrases.length) {
            const list = document.createElement("div");
            list.className = "phrase-list";
            const counts = (daily && daily.counts) || {};
            phrases.forEach((p) => {
              const n = counts[p.id] || 0;
              const row = document.createElement("div");
              row.className = "phrase-row" + (n === 0 ? " zero" : "");
              const label = document.createElement("div");
              label.className = "label";
              label.textContent = p.label;
              const count = document.createElement("div");
              count.className = "count";
              count.textContent = n;
              row.appendChild(label);
              row.appendChild(count);
              list.appendChild(row);
            });
            card.appendChild(list);
          } else {
            const none = document.createElement("div");
            none.className = "no-phrases";
            none.textContent = "لسه معملش أي أذكار";
            card.appendChild(none);
          }

          cardsEl.appendChild(card);
        });
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          loginScreen.classList.add("hidden");
          dashScreen.classList.remove("hidden");
          emailInput.value = "";
          passInput.value = "";
          startUsersListener();
        } else {
          dashScreen.classList.add("hidden");
          loginScreen.classList.remove("hidden");
          stopAllListeners();
        }
      });
    </script>
  </body>
</html>
